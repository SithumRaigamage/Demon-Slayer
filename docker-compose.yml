# ================================
# Demon Slayer Website - Docker Compose
# ================================

services:
  demon-slayer-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demon-slayer-website
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "app=demon-slayer"
      - "env=production"

# Optional: Add network for integration with other services
networks:
  default:
    name: demon-slayer-network
