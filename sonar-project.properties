# SonarQube Project Configuration
# ================================

# SonarQube Server
sonar.host.url=http://localhost:9000

# Authentication (generate token from SonarQube: Admin > My Account > Security > Generate Token)
sonar.token=sqa_ab198fa29b7205dc672f210d21f52fe601a67914

# Unique project identifier
sonar.projectKey=demon-slayer
sonar.projectName=Demon Slayer
sonar.projectVersion=1.0.0

# Project description
sonar.projectDescription=A fan website for Demon Slayer anime featuring characters, combat styles, and series information

# Source code location
sonar.sources=.

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Include patterns (what to analyze)
sonar.inclusions=**/*.js,**/*.html,**/*.css

# Exclude patterns (what to skip)
sonar.exclusions=**/node_modules/**,**/*.min.js,**/*.min.css,**/Pictures/**,**/*.mp3,**/*.mov,**/.git/**

# Language-specific settings
sonar.javascript.file.suffixes=.js
sonar.html.file.suffixes=.html
sonar.css.file.suffixes=.css

# Test files (if you add tests later)
# sonar.tests=tests
# sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage reports (if you add testing)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate settings
sonar.qualitygate.wait=true

# Duplicate code detection
sonar.cpd.js.minimumTokens=100
sonar.cpd.css.minimumTokens=100

# Issue severity
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
